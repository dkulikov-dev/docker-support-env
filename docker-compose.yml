version: '3.8'

services:
  # Наш Python-анализатор
  log-analyzer:
    build: .
    container_name: support_log_analyzer
    volumes:
      - .:/app

  # Контейнер с PostgreSQL для отладки и тестов
  postgres-db:
    image: postgres:15-alpine
    container_name: support_postgres_db
    environment:
      POSTGRES_DB: support_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"